name: Release

on:
  push:
    tags: ["v*"]

# Actions pinned to commit SHAs: this job holds the updater signing key.
permissions:
  contents: write

jobs:
  release:
    # Apple silicon runner; ad-hoc signed ("-" in tauri.conf.json), no Apple certificates.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The updater compares latest.json's version (from tauri.conf.json) with the installed one.
      - name: Tag matches app version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version src-tauri/tauri.conf.json)"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Builds the DMG and updater .tar.gz, minisign-signs it (.sig), writes latest.json.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quest Log ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
