<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers issue #10 "Pixel-art visual direction".
  Three radically different pixel-art directions for Quest Log, switchable via ?variant=A|B|C
  (floating bar at the bottom, or ← / → keys). Each variant shows: Quests, Timer, Dashboard, Style kit.
  Open by double-clicking. All data is fake and in memory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Quest Log visual direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&family=Jersey+10&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { image-rendering: pixelated; -webkit-font-smoothing: none; }
  svg.px { shape-rendering: crispEdges; display: inline-block; vertical-align: middle; flex: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { min-height: 100vh; padding-bottom: 80px; }

  /* ---------- floating switcher (not part of any design) ---------- */
  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 99;
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
    background: #fff; color: #111; box-shadow: 0 4px 20px rgba(0,0,0,.45), 0 0 0 2px #ff2d87;
    font: 600 13px/1 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: auto; }
  #switcher button { border: 0; background: #111; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; }
  #switcher span { padding: 0 12px; min-width: 260px; text-align: center; }
  #switcher small { display: block; font-weight: 400; color: #777; margin-top: 3px; font-size: 11px; }

  /* =====================================================================
     VARIANT A — Command Window (16-bit JRPG menus)
     ===================================================================== */
  .va { --bg:#0a0a1e; --win1:#2b3aa8; --win2:#0d1660; --edge:#ffffff; --edge2:#7c86c8; --ink:#ffffff; --dim:#a9b0e0;
        --gold:#ffd84a; --hp:#5cf07a; --mp:#4ac8ff; --red:#ff5a5a;
        font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.9; color: var(--ink);
        background: radial-gradient(#ffffff22 1px, transparent 1px) 0 0/24px 24px, var(--bg); min-height: 100vh; }
  .va .shell { max-width: 1120px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 210px 1fr; grid-template-rows: auto 1fr auto; gap: 12px; min-height: calc(100vh - 80px); }
  .va .win { background: linear-gradient(var(--win1), var(--win2)); border: 3px solid var(--edge); border-radius: 7px;
             box-shadow: inset 0 0 0 2px var(--edge2), 0 0 0 2px #000; padding: 14px 16px; }
  .va .cmd { grid-row: 1 / 3; }
  .va .cmd h1 { font-size: 11px; color: var(--gold); margin-bottom: 12px; }
  .va .cmd button { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: 0; padding: 6px 0 6px 20px; text-align: left; position: relative; }
  .va .cmd button.on::before { content: '▶'; position: absolute; left: 0; animation: va-blink 1s steps(2) infinite; }
  .va .cmd hr { border: 0; border-top: 2px dotted var(--edge2); margin: 10px 0; }
  .va .cmd .meta { color: var(--dim); font-size: 9px; }
  @keyframes va-blink { 50% { opacity: 0; } }
  .va .top { display: flex; gap: 12px; }
  .va .top .win { padding: 8px 14px; }
  .va .top .grow { flex: 1; }
  .va .gold { color: var(--gold); }
  .va .dim { color: var(--dim); }
  .va .main h2 { font-size: 12px; margin-bottom: 14px; color: var(--gold); }
  .va .msg { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .va .msg .t { font-size: 14px; color: var(--hp); }
  .va .row { display: grid; grid-template-columns: 18px 1fr 120px 110px 90px; gap: 10px; padding: 7px 4px; align-items: center; }
  .va .row.head { color: var(--dim); font-size: 8px; border-bottom: 2px dotted var(--edge2); }
  .va .row.sel { background: #ffffff22; outline: 2px solid var(--edge); }
  .va .row .r { text-align: right; }
  .va .tag { display: inline-block; padding: 0 6px; border: 2px solid currentColor; font-size: 8px; line-height: 1.8; }
  .va .bar { height: 10px; background: #000; border: 2px solid var(--edge); position: relative; }
  .va .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(var(--hp), #1d9a3a); }
  .va .bar.mp i { background: linear-gradient(var(--mp), #1a6ab0); }
  .va .bar.gd i { background: linear-gradient(var(--gold), #b08a10); }
  .va .btn { background: none; border: 0; padding: 4px 4px 4px 18px; position: relative; }
  .va .btn:hover::before, .va .btn.on::before { content: '▶'; position: absolute; left: 0; }
  .va .btn.danger { color: var(--red); }
  .va .btn[disabled] { color: #6870a8; cursor: default; }
  .va .bigtime { font-size: 46px; line-height: 1.3; letter-spacing: 2px; text-align: center; margin: 22px 0 10px; text-shadow: 4px 4px 0 #000; }
  .va .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .va .stat { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; align-items: center; }
  .va .party { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .va input { font: inherit; color: var(--ink); background: #000a; border: 2px solid var(--edge); padding: 6px 8px; width: 100%; }
  .va .swatch { width: 44px; height: 44px; border: 3px solid var(--edge); }

  /* =====================================================================
     VARIANT B — Handheld (4-shade DMG green, HUD + bottom tab bar)
     ===================================================================== */
  .vb { --c0:#0f380f; --c1:#306230; --c2:#8bac0f; --c3:#9bbc0f;
        font-family: 'Silkscreen', monospace; font-size: 13px; line-height: 1.5; color: var(--c0); background: var(--c1); min-height: 100vh; }
  .vb .device { max-width: 760px; margin: 0 auto; padding: 20px 20px 0; }
  .vb .screen { background: var(--c3); border: 4px solid var(--c0); box-shadow: 0 0 0 8px #8b8b9a, 0 0 0 12px #55556a; min-height: calc(100vh - 140px); display: flex; flex-direction: column; }
  .vb .hud { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--c0); color: var(--c3); }
  .vb .hud .t { font-family: 'VT323', monospace; font-size: 28px; line-height: 1; }
  .vb .hud .sp { flex: 1; }
  .vb .body { flex: 1; padding: 14px; }
  .vb .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 4px solid var(--c0); }
  .vb .tabs button { background: var(--c2); border: 0; border-right: 4px solid var(--c0); padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
  .vb .tabs button:last-child { border-right: 0; }
  .vb .tabs button.on { background: var(--c0); color: var(--c3); }
  .vb h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
  .vb .dither { background: repeating-conic-gradient(var(--c1) 0 25%, var(--c2) 0 50%) 0 0/4px 4px; }
  .vb .list > div { display: flex; align-items: center; gap: 12px; padding: 10px; border: 4px solid var(--c0); margin-bottom: -4px; background: var(--c3); }
  .vb .list > div.done { background: var(--c2); }
  .vb .list .n { font-family: 'VT323', monospace; font-size: 24px; line-height: 1; }
  .vb .list .grow { flex: 1; }
  .vb .small { font-size: 10px; }
  .vb .num { font-family: 'VT323', monospace; font-size: 22px; line-height: 1; }
  .vb .btn { background: var(--c0); color: var(--c3); border: 0; padding: 8px 14px; box-shadow: 4px 4px 0 var(--c1); display: inline-flex; gap: 6px; align-items: center; }
  .vb .btn:active { transform: translate(4px,4px); box-shadow: none; }
  .vb .btn.ghost { background: var(--c3); color: var(--c0); outline: 4px solid var(--c0); outline-offset: -4px; }
  .vb .btn[disabled] { background: var(--c2); color: var(--c1); box-shadow: none; }
  .vb .lcd { font-family: 'VT323', monospace; font-size: 120px; line-height: .9; text-align: center; padding: 20px 0 10px; letter-spacing: 4px; }
  .vb .lcd .colon { animation: vb-blink 1s steps(2) infinite; }
  @keyframes vb-blink { 50% { opacity: .15; } }
  .vb .chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; border-bottom: 4px solid var(--c0); padding: 0 4px; }
  .vb .chart div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .vb .chart i { width: 100%; background: var(--c0); display: block; }
  .vb .chart i.now { background: repeating-conic-gradient(var(--c0) 0 25%, var(--c1) 0 50%) 0 0/4px 4px; }
  .vb .days { display: flex; gap: 8px; padding: 2px 4px 0; font-size: 10px; }
  .vb .days span { flex: 1; text-align: center; }
  .vb .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .vb .tiles > div { border: 4px solid var(--c0); padding: 6px 8px; }
  .vb .tiles > div.inv { background: var(--c0); color: var(--c3); }
  .vb .seg { display: inline-flex; border: 4px solid var(--c0); }
  .vb .seg button { border: 0; background: none; padding: 2px 10px; font-size: 11px; }
  .vb .seg button.on { background: var(--c0); color: var(--c3); }
  .vb input { font: inherit; background: var(--c3); border: 4px solid var(--c0); padding: 6px 8px; width: 100%; color: var(--c0); }
  .vb .swatch { width: 56px; height: 56px; border: 4px solid var(--c0); }

  /* =====================================================================
     VARIANT C — Tavern Ledger (parchment, wood, wax seals; quest board)
     ===================================================================== */
  .vc { --wood:#5a3519; --wood2:#7a4a24; --wood3:#a0652f; --parch:#f2e2b6; --parch2:#e3cb8f; --ink:#3b2412; --ink2:#7d5a36;
        --wax:#a3242a; --gold:#e0a417; --moss:#4f7a2b; --cork:#b98a52;
        font-family: 'Pixelify Sans', sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink);
        background: repeating-linear-gradient(0deg, var(--wood) 0 22px, #4d2d14 22px 24px), var(--wood); min-height: 100vh; }
  .vc .notch { clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)); }
  .vc .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px 24px; }
  .vc nav { display: flex; gap: 18px; align-items: flex-start; padding-bottom: 18px; }
  .vc nav .sign { background: var(--wood3); color: var(--parch); border: 0; font-family: 'Jersey 10', sans-serif; font-size: 26px; padding: 26px 18px 6px; position: relative; box-shadow: inset 0 -4px 0 var(--wood), 4px 4px 0 #0006; display: flex; gap: 8px; align-items: center; }
  .vc nav .sign.on { background: var(--parch); color: var(--ink); padding-top: 34px; }
  .vc nav .brand { font-family: 'Jersey 10', sans-serif; font-size: 40px; color: var(--gold); text-shadow: 3px 3px 0 #000; padding-top: 14px; margin-right: auto; }
  .vc nav .purse { margin-left: auto; padding-top: 22px; color: var(--parch); display: flex; gap: 8px; align-items: center; font-size: 18px; }
  .vc .parch { background: var(--parch); box-shadow: inset 0 0 0 4px var(--parch2); padding: 18px 20px; }
  .vc h2 { font-family: 'Jersey 10', sans-serif; font-size: 34px; font-weight: 400; line-height: 1; margin-bottom: 12px; }
  .vc h3 { font-family: 'Jersey 10', sans-serif; font-size: 24px; font-weight: 400; line-height: 1; }
  .vc .muted { color: var(--ink2); }
  .vc .board { background: var(--cork); background-image: radial-gradient(#7a5a30 1.5px, transparent 1.5px), radial-gradient(#d6a868 1px, transparent 1px); background-size: 9px 9px, 13px 13px; padding: 22px; border: 8px solid var(--wood2); box-shadow: inset 0 0 0 4px var(--wood); }
  .vc .board-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 14px; color: var(--parch); }
  .vc .board-head h2 { color: var(--parch); text-shadow: 3px 3px 0 var(--wood); }
  .vc .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
  .vc .note { background: var(--parch); padding: 22px 16px 14px; position: relative; box-shadow: 5px 5px 0 #0005; }
  .vc .note:nth-child(3n+1) { transform: rotate(-1.5deg); } .vc .note:nth-child(3n+2) { transform: rotate(1deg); }
  .vc .note::before { content: ''; position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; background: var(--wax); box-shadow: 2px 2px 0 #0006; }
  .vc .note.done { background: var(--parch2); }
  .vc .note .stamp { position: absolute; right: 10px; bottom: 10px; transform: rotate(-12deg); color: var(--moss); border: 3px solid var(--moss); padding: 0 6px; font-family: 'Jersey 10', sans-serif; font-size: 20px; }
  .vc .kv { display: flex; justify-content: space-between; border-bottom: 2px dashed var(--parch2); padding: 3px 0; }
  .vc .btn { background: var(--wood2); color: var(--parch); border: 0; padding: 8px 16px; box-shadow: inset 0 -4px 0 var(--wood), inset 0 4px 0 var(--wood3); display: inline-flex; gap: 8px; align-items: center; font-size: 16px; }
  .vc .btn.wax { background: var(--wax); box-shadow: inset 0 -4px 0 #6d1418, inset 0 4px 0 #c94a4f; }
  .vc .btn.paper { background: var(--parch2); color: var(--ink); box-shadow: inset 0 -4px 0 var(--ink2); }
  .vc .btn[disabled] { background: #b8a888; color: #806d55; box-shadow: none; cursor: default; }
  .vc .timer { display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
  .vc .hourglass { font-family: 'Jersey 10', sans-serif; font-size: 110px; line-height: 1; text-align: center; margin: 16px 0; }
  .vc .candle { height: 16px; background: var(--parch2); box-shadow: inset 0 0 0 3px var(--ink2); position: relative; }
  .vc .candle i { position: absolute; inset: 3px auto 3px 3px; background: var(--gold); }
  .vc .book { display: grid; grid-template-columns: 1fr 1fr; background: var(--parch); box-shadow: 0 0 0 8px var(--wax), 0 0 0 12px #6d1418, 8px 8px 0 12px #0007; margin-top: 8px; }
  .vc .book > div { padding: 22px 26px; }
  .vc .book > div:first-child { border-right: 4px double var(--ink2); }
  .vc .seal { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 0 8px; }
  .vc .seal.unsealed { color: var(--ink2); border: 2px dashed var(--ink2); }
  .vc .seal.sealed { color: var(--parch); background: var(--wax); }
  .vc .seal.redeemed { color: var(--parch); background: var(--moss); }
  .vc input { font: inherit; background: #fff8e0; border: 0; box-shadow: inset 0 0 0 3px var(--ink2); padding: 8px 10px; width: 100%; color: var(--ink); }
  .vc .swatch { width: 52px; height: 52px; box-shadow: inset 0 0 0 3px #0004; }
  .vc table { width: 100%; border-collapse: collapse; }
  .vc td { padding: 5px 4px; border-bottom: 2px dashed var(--parch2); }
  .vc td.r { text-align: right; }

  /* kit bits shared across variants (structure only; colours come from the variant) */
  .kit { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kit section { display: flex; flex-direction: column; gap: 10px; }
  .kit .sw { display: flex; flex-wrap: wrap; gap: 10px; }
  .kit .sw > div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .75em; }
  .kit .icons { display: flex; flex-wrap: wrap; gap: 14px; }
  .kit .icons > div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7em; }
  .flexrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher">
  <button id="prev" aria-label="Previous variant">◀</button>
  <span id="label"></span>
  <button id="next" aria-label="Next variant">▶</button>
</div>
<script>
// ---------------------------------------------------------------- fake data
const NOW = Date.now();
const timer = { startedAt: NOW - (1*3600 + 23*60 + 12)*1000, patron: 'Acme Robotics', quest: 'Warehouse dashboard', note: 'Chart tooltips', rate: 90 };
const patrons = [
  { name: 'Acme Robotics', rate: 90 },
  { name: 'Lumen Studio', rate: 75 },
  { name: 'Oakfield Library', rate: 60 },
];
const quests = [
  { name: 'Warehouse dashboard', patron: 'Acme Robotics', rate: null, hours: 14.2, status: 'Active' },
  { name: 'Firmware docs', patron: 'Acme Robotics', rate: 110, hours: 6.5, status: 'Active' },
  { name: 'Brand site rebuild', patron: 'Lumen Studio', rate: null, hours: 22.8, status: 'Active' },
  { name: 'Catalog search', patron: 'Oakfield Library', rate: null, hours: 9.0, status: 'Active' },
  { name: 'Volunteer workshop', patron: 'Oakfield Library', rate: 0, hours: 3.0, status: 'Active' },
  { name: 'Logo refresh', patron: 'Lumen Studio', rate: null, hours: 11.0, status: 'Complete' },
];
const entries = [
  { date: 'Wed Oct 7', patron: 'Acme Robotics', quest: 'Warehouse dashboard', note: 'Chart grid', secs: 2*3600+10*60, rate: 90 },
  { date: 'Tue Oct 6', patron: 'Lumen Studio', quest: 'Brand site rebuild', note: 'Hero section', secs: 3*3600+5*60, rate: 75 },
  { date: 'Tue Oct 6', patron: 'Oakfield Library', quest: null, note: 'Call with the librarian', secs: 40*60, rate: 60 },
  { date: 'Mon Oct 5', patron: 'Acme Robotics', quest: 'Firmware docs', note: 'OTA section', secs: 1*3600+50*60, rate: 110 },
  { date: 'Sat Oct 3', patron: 'Lumen Studio', quest: 'Brand site rebuild', note: 'Nav', secs: 4*3600, rate: 75, locked: true },
  { date: 'Fri Oct 2', patron: 'Acme Robotics', quest: 'Warehouse dashboard', note: 'Data model', secs: 3*3600+30*60, rate: 90, locked: true },
];
const scrolls = [
  { no: '0008', patron: 'Acme Robotics', period: 'Sep 21 – Oct 4', gold: 990.00, state: 'Unsealed' },
  { no: '0007', patron: 'Lumen Studio', period: 'Sep 14 – Oct 3', gold: 1875.00, state: 'Sealed' },
  { no: '0006', patron: 'Acme Robotics', period: 'Sep 1 – Sep 20', gold: 3420.00, state: 'Redeemed' },
];
const week = [ ['Mon', 1.83], ['Tue', 3.75], ['Wed', 2.17], ['Thu', 0], ['Fri', 0], ['Sat', 0], ['Sun', 0] ];
const level = { lv: 7, xp: 312, next: 400 }; // XP rules not decided yet (#7) — placeholder

// ---------------------------------------------------------------- helpers
const elapsed = () => Math.floor((Date.now() - timer.startedAt) / 1000);
const hms = s => `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const hm = s => `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
const g = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const gold = e => e.secs * e.rate / 3600;
const unclaimed = () => entries.filter(e => !e.locked).reduce((a, e) => a + gold(e), 0) + elapsed() * timer.rate / 3600;
const owed = scrolls.filter(s => s.state === 'Sealed').reduce((a, s) => a + s.gold, 0);
const treasury = scrolls.filter(s => s.state === 'Redeemed').reduce((a, s) => a + s.gold, 0);
const weekHours = () => week.reduce((a, [, h]) => a + h, 0) + elapsed() / 3600;
const rateOf = q => q.rate ?? patrons.find(p => p.name === q.patron).rate;

// 8x8 pixel icons: '#' = currentColor, '+' = --accent (falls back to currentColor), '.' = empty
const ICONS = {
  quest:  ['.......#','......##','.....##.','#..##...','.###....','..#.....','.#.#....','#.......'],
  coin:   ['..####..','.#++++#.','#++##++#','#+#++++#','#+#++++#','#++##++#','.#++++#.','..####..'],
  timer:  ['########','.#....#.','..#++#..','...##...','...##...','..#..#..','.#++++#.','########'],
  scroll: ['.######.','#+....+#','.#....#.','.#.##.#.','.#....#.','.#.##.#.','#+....+#','.######.'],
  patron: ['########','#++++++#','#++##++#','#+####+#','#++##++#','.#++++#.','..#++#..','...##...'],
  chest:  ['.######.','#++++++#','########','#++##++#','#++##++#','#++++++#','########','........'],
  play:   ['#.......','###.....','#####...','#######.','#####...','###.....','#.......','........'],
  stop:   ['........','.######.','.######.','.######.','.######.','.######.','.######.','........'],
  star:   ['...##...','...##...','########','.######.','..####..','.##..##.','##....##','........'],
  chart:  ['........','......##','......##','...##.##','...##.##','##.##.##','##.##.##','########'],
  lock:   ['..####..','.#....#.','.#....#.','########','#++++++#','#+++#++#','#++++++#','########'],
  kit:    ['.#.##.#.','########','.#....#.','##.##.##','##.##.##','.#....#.','########','.#.##.#.'],
};
const icon = (name, size = 16) => {
  let r = '';
  ICONS[name].forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '#') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="currentColor"/>`;
    if (c === '+') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--accent, currentColor)" opacity=".55"/>`;
  }));
  return `<svg class="px" width="${size}" height="${size}" viewBox="0 0 8 8">${r}</svg>`;
};
const live = () => `<span data-live="hms">${hms(elapsed())}</span>`;

// ---------------------------------------------------------------- shared kit body (layout only)
function kit(v, { palette, fonts, buttons, panel, input, badges, size }) {
  return `<div class="kit">
    <section>${panel('Palette', `<div class="sw">${palette.map(([n, c]) => `<div><div class="swatch" style="background:${c}"></div>${n}<span style="opacity:.6">${c}</span></div>`).join('')}</div>`)}</section>
    <section>${panel('Type', fonts)}</section>
    <section>${panel('Buttons', `<div class="flexrow">${buttons}</div>`)}</section>

// ---------------------------------------------------------------- switcher + routing
const VARIANTS = { A, B, C };
const KEYS = Object.keys(VARIANTS);
const params = () => new URLSearchParams(location.search);
let cur = {};
function go(variant, screen) {
  const v = VARIANTS[variant] ? variant : 'A';
  const valid = VARIANTS[v].screens.map(s => s[0]);
  const s = valid.includes(screen) ? screen : valid[0];
  try { history.replaceState(null, '', `?variant=${v}&screen=${s}`); } catch {} // ponytail: some file:// viewers block this; URL just won't update
  cur = { v, s };
  document.getElementById('app').innerHTML = VARIANTS[v].render(s);
  document.getElementById('label').innerHTML = `${v} — ${VARIANTS[v].name}<small>screen: ${s} · ← → to switch variant</small>`;
  document.title = `PROTOTYPE · ${v} · Quest Log`;
}
const cycle = d => go(KEYS[(KEYS.indexOf(cur.v) + d + KEYS.length) % KEYS.length], cur.s);
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-screen]');
  if (b) go(cur.v, b.dataset.screen);
});
go(params().get('variant'), params().get('screen'));

// live timer tick (1 Hz) — only touches [data-live] nodes
setInterval(() => {
  const s = elapsed();
  const set = (k, f) => document.querySelectorAll(`[data-live="${k}"]`).forEach(f);
  set('hms', n => n.textContent = hms(s));
  set('lcd', n => n.innerHTML = lcd());
  set('gold', n => n.textContent = g(s * timer.rate / 3600));
  set('unclaimed', n => n.textContent = g(unclaimed()));
  set('week', n => n.textContent = weekHours().toFixed(1));
  set('weekbar', n => n.style.width = weekHours() / 40 * 100 + '%');
  set('day', n => n.style.width = Math.min(100, (2.17*3600 + s) / 28800 * 100) + '%');
  set('wedbar', n => n.style.height = (2.17 + s/3600) / 8 * 100 + '%');
}, 1000);
